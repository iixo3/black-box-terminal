<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Black Box Terminal — Design review</title><link rel="icon" href="mark.svg"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 95% 75% at 80% -18%,rgba(123,150,183,.12),transparent 80%),radial-gradient(ellipse 90% 100% at 112% 78%,rgba(63,88,123,.075),transparent 75%),#030405;background-attachment:fixed;color:#e8e9e3;font-family:Arial,sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column}.review-bar{display:flex;justify-content:space-between;align-items:center;padding:0 20px;height:50px;flex:none;background:transparent;border-bottom:0;gap:12px;font-size:11px}.review-label{font-family:monospace;letter-spacing:.04em;color:#a8b3b8}.review-label strong{color:#f2f2e9;font-weight:400}.controls{display:flex;align-items:center;gap:5px}.controls button{font:11px Arial,sans-serif;border:1px solid transparent;color:#adb7bb;background:none;padding:7px 12px;cursor:pointer}.controls button[aria-pressed=true]{background:#253139;border-color:#455866;color:#f1f2eb}.controls a{font-size:11px;color:#a8b3b8;margin-left:16px;text-decoration:none}.controls a:hover{color:white}.stage{flex:1;min-height:0;display:grid;place-items:center;padding:18px;overflow:hidden}.canvas{position:relative;overflow:hidden}iframe{border:0;position:absolute;top:0;left:0;transform-origin:top left;background:transparent;display:block}button:focus-visible,a:focus-visible{outline:2px solid #b1c8d8;outline-offset:3px}@media(max-width:600px){.review-bar{padding:0 10px;height:44px}.review-label span,.first-study{display:none}.controls a{margin-left:5px}.controls button{padding:6px 8px}.stage{padding:8px}}
</style></head><body><header class="review-bar"><div class="review-label"><strong>BBT</strong><span> / STUDY 03 / OUTFIT</span></div><div class="controls" aria-label="Preview device"><button data-device="desktop" aria-pressed="true">Desktop</button><button data-device="phone" aria-pressed="false">Phone</button><a href="v1/preview.html" target="_blank" rel="noopener" class="first-study">Study 01 ↗</a><a href="index.html" target="_blank" rel="noopener">Open full page ↗</a></div></header><main class="stage"><div class="canvas"><iframe src="index.html?embedded=1&amp;study=03c" title="Interactive Black Box Terminal prototype"></iframe></div></main><script>
const stage=document.querySelector('.stage'),canvas=document.querySelector('.canvas'),frame=document.querySelector('iframe');let device=new URLSearchParams(location.search).get('device')==='phone'||window.innerWidth<800?'phone':'desktop';
function resizePreview(){const inset=window.innerWidth<=600?16:36;const availableWidth=stage.clientWidth-inset,availableHeight=stage.clientHeight-inset;const width=device==='phone'?390:1440,height=device==='phone'?844:900;const scale=Math.min(availableWidth/width,availableHeight/height,1);canvas.style.width=`${width*scale}px`;canvas.style.height=`${height*scale}px`;frame.style.width=`${width}px`;frame.style.height=`${height}px`;frame.style.transform=`scale(${scale})`;document.querySelectorAll('[data-device]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.device===device)));}
document.querySelectorAll('[data-device]').forEach(button=>button.addEventListener('click',()=>{device=button.dataset.device;resizePreview()}));new ResizeObserver(resizePreview).observe(stage);resizePreview();
</script></body></html>
